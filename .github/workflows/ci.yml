name: Validate NeighbourAssist

on:
  push:
  pull_request:

# Validation requires read access to repository contents only.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check referral routes
        run: npm test
      - name: Build React application
        run: npm run build
